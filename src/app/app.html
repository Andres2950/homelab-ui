<main class="main">
  <div class="content">
    <div class="text-3xl font-bold max-w-sm mx-auto m-10">
      <h1 class="w-full text-center">Debian Homelab</h1>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>

    <div class="text-xl max-w-sm mx-auto m-7">
      <div class="pill-group flex flex-col items-center gap-4">
        @for (item of links; track item.title) {
          <a
            class="pill flex items-center justify-center gap-3 hover:bg-red-300 rounded-xl px-6 py-2 w-full border"
            [href]="item.url"
            target="_blank"
            rel="noopener noreferrer"
          >
            <ng-icon [name]="item.icon" size="1.25em" aria-hidden="true" />
            <span>{{ item.title }}</span>
          </a>
        }
      </div>
    </div>
  </div>
</main>

<router-outlet />
